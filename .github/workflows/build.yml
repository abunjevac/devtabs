name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev

      - name: Build
        run: |
          go build \
            -ldflags "-X github.com/abunjevac/devtabs/internal/version.Version=${{ github.ref_name }}" \
            -o devtabs \
            ./cmd/devtabs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "devtabs ${{ github.ref_name }}" \
            --generate-notes \
            devtabs

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName')
          count=$(echo "$releases" | grep -c .)
          if [ "$count" -le 3 ]; then
            echo "Only $count release(s); nothing to prune."
            exit 0
          fi
          echo "$releases" | tail -n +4 | while IFS= read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
