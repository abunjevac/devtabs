startup_tab: go version
font: "Google Sans Code"
font_size: 14
window_width: 1400
window_height: 1000

tabs:
  - name: apt update
    command: sudo apt update
    run_on_startup: false

  - name: task check
    command: task check
    run_on_startup: false

  - name: go version
    command: go version
    run_on_startup: true
