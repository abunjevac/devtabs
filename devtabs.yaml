startup_tab: go version
wrap_tab_navigation: true
font: Google Sans Code
font_size: 14
window_width: 1400
window_height: 1000
title: DevTabs
file_manager: dolphin
editor: zed .

tabs:
  - name: task check
    command: task check
    alt_command: task --version

  - name: apt update
    command: sudo apt update

  - name: go version
    command: go version
    run_on_startup: true
