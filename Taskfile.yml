version: "3"

tasks:
  build:
    desc: Build devtabs binary
    vars:
      VERSION:
        sh: git tag -l | head -1 2>/dev/null || echo "dev"
    cmds:
      - go build -ldflags "-X github.com/abunjevac/devtabs/internal/version.Version={{.VERSION}}" -o devtabs ./cmd/devtabs

  pack:
    desc: Package devtabs binary with upx
    cmds:
      - upx -6 -q devtabs

  run:
    desc: Build and run with ./devtabs.yaml
    cmds:
      - task: build
      - ./devtabs --config ./devtabs.yaml

  lint:
    desc: Run golangci-lint and go vet
    cmds:
      - golangci-lint run --allow-parallel-runners --timeout 5m
      - go vet ./...

  test:
    desc: Run tests with detector
    cmds:
      - go test -count=1 ./...
  scan:
    desc: Run osv-scanner for dependency vulnerabilities
    cmds:
      - osv-scanner .

  check:
    desc: Full quality gate — lint + test + scan
    cmds:
      - task: lint
      - task: test
      - task: scan

  install:
    desc: Install devtabs to $GOPATH/bin
    cmds:
      - go install .

  install-desktop:
    desc: Install desktop launcher and app icon for the current user
    cmds:
      - mkdir -p ~/.local/share/icons/hicolor/512x512/apps ~/.local/share/applications
      - cp assets/io.github.abunjevac.devtabs.png ~/.local/share/icons/hicolor/512x512/apps/io.github.abunjevac.devtabs.png
      - cp assets/io.github.abunjevac.devtabs.desktop ~/.local/share/applications/io.github.abunjevac.devtabs.desktop
      - update-desktop-database ~/.local/share/applications
      - gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor

  uninstall-desktop:
    desc: Remove desktop launcher and app icon for the current user
    cmds:
      - rm -f ~/.local/share/icons/hicolor/512x512/apps/io.github.abunjevac.devtabs.png
      - rm -f ~/.local/share/applications/io.github.abunjevac.devtabs.desktop
      - update-desktop-database ~/.local/share/applications
      - gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy
